<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121017">
  <meta name="robots" content="noindex">
  <title>Avalon Host</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
</head>
<body class="host">
  <header class="top">
    <h1>Avalon <span class="sub">host</span></h1>
    <div class="muted small">Keep this tab open and in front: it <i>is</i> the game.</div>
  </header>
  <main>
    <div id="room"></div>
    <div id="seat"></div>
    <div id="controls"></div>
    <div id="settings"></div>
  </main>
  <div id="toast" class="toast" hidden></div>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script type="module" src="../js/host.js"></script>
</body>
</html>
